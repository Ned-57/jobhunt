<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHunt</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127919;</text></svg>">
</head>
<body>

<!-- ============ boot / auth gate ============ -->
<div id="gate" class="gate-wrap">
  <div id="gate-inner" class="gate">
    <div class="gate-brand"><span class="brand-mark">JH</span> JobHunt</div>
    <p class="muted" id="gate-status"><span class="loading"></span> Starting up&hellip;</p>
  </div>
</div>

<!-- ============ app shell ============ -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">JH</span>
      <span class="brand-text">JobHunt</span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/profile"  data-view="profile">Profile <span class="nav-badge" id="badge-profile"></span></a>
      <a class="nav-item" href="#/hunt"     data-view="hunt">Hunt for jobs</a>
      <a class="nav-item" href="#/tracker"  data-view="tracker">Applications <span class="nav-badge" id="badge-apps"></span></a>
      <a class="nav-item" href="#/cv"       data-view="cv">Build a CV</a>
      <a class="nav-item" href="#/account"  data-view="account">Account &amp; data</a>
    </nav>

    <div class="sidebar-foot">
      <div id="sync-state" class="storage-note">&nbsp;</div>
      <div class="row row-tight">
        <button class="btn btn-ghost btn-sm" id="theme-toggle" type="button">Theme</button>
        <button class="btn btn-ghost btn-sm" id="signout-btn" type="button">Sign out</button>
      </div>
      <div class="storage-note" id="who"></div>
    </div>
  </aside>

  <main class="main">
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="print-root" class="print-root" aria-hidden="true"></div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
